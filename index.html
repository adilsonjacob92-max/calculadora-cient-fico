<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10121b">
  <title>Calculadora — Nova</title>
  <style>
    :root { color-scheme: dark; --bg:#10121b; --panel:#191c28; --muted:#9298ad; --text:#f5f6fb; --accent:#a78bfa; --accent2:#7555e8; --key:#252938; --key-hover:#303548; }
    * { box-sizing:border-box }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; color:var(--text); background:radial-gradient(ellipse at 15% 10%,#292046 0,transparent 38%),radial-gradient(ellipse at 90% 90%,#172e3d 0,transparent 35%),var(--bg); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif }
    .app { width:min(100%,390px); padding:25px; border:1px solid rgba(255,255,255,.09); border-radius:30px; background:rgba(25,28,40,.88); box-shadow:0 28px 80px rgba(0,0,0,.42); backdrop-filter:blur(18px) }
    header { display:flex; align-items:center; justify-content:space-between; margin-bottom:25px }
    .brand { display:flex; align-items:center; gap:11px; font-size:14px; font-weight:700; letter-spacing:.04em }
    .logo { display:grid; place-items:center; width:35px; height:35px; border-radius:12px; color:#fff; background:linear-gradient(145deg,#b49aff,#7453e7); box-shadow:0 5px 18px #795be755; font-size:20px }
    .tag { color:var(--muted); font-size:11px; letter-spacing:.08em; text-transform:uppercase }
    .mode-toggle { height:auto; padding:8px 11px; border:1px solid #38324e; border-radius:11px; color:#cfc2ff; background:#29263a; font:700 10px/1 inherit; letter-spacing:.08em }
    .scientific { display:none; grid-template-columns:repeat(4,1fr); gap:9px; margin:0 0 10px }
    .scientific.open { display:grid }
    .scientific button { height:47px; border-radius:14px; color:#cbd3e8; background:#222737; font-size:15px }
    .scientific button.constant { color:#cdbfff; background:#2c2940 }
    .scientific button.mode { color:#a9e5d1; background:#20352f }
    .screen { min-height:142px; display:flex; flex-direction:column; justify-content:flex-end; align-items:flex-end; padding:14px 3px 23px; overflow:hidden }
    .expression { min-height:25px; max-width:100%; color:var(--muted); font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
    .result { width:100%; color:var(--text); font-size:clamp(42px,12vw,58px); font-weight:500; line-height:1.15; text-align:right; letter-spacing:-.055em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
    .keys { display:grid; grid-template-columns:repeat(4,1fr); gap:11px }
    button { height:66px; border:0; border-radius:19px; color:var(--text); background:var(--key); font:600 20px/1 inherit; cursor:pointer; transition:transform .12s,background .12s,filter .12s; -webkit-tap-highlight-color:transparent }
    button:hover { background:var(--key-hover) } button:active { transform:scale(.94); filter:brightness(1.2) }
    button.utility { color:#c0b5ed; background:#29263a; font-size:17px }
    button.operator { color:#d6caff; background:#30294a; font-size:25px }
    button.equals { color:white; background:linear-gradient(145deg,var(--accent),var(--accent2)); box-shadow:0 8px 22px #7555e844; font-size:25px }
    button.zero { grid-column:span 2; text-align:left; padding-left:27px }
    footer { display:flex; justify-content:center; gap:7px; align-items:center; margin-top:20px; color:#73798d; font-size:11px }
    .dot { width:5px;height:5px;border-radius:50%;background:#9d84f7 }
    @media(max-width:390px){ .app{padding:20px;border-radius:25px}.keys{gap:9px}button{height:61px;border-radius:17px} }
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
  </style>
</head>
<body>
  <main class="app" aria-label="Calculadora">
    <header><div class="brand"><span class="logo" aria-hidden="true">÷</span><span>NOVA CALC</span></div><button class="mode-toggle" id="modeToggle" aria-expanded="false">+ CIENTÍFICA</button></header>
    <section class="screen" aria-live="polite" aria-atomic="true">
      <div class="expression" id="expression"></div>
      <div class="result" id="display">0</div>
    </section>
    <section class="scientific" id="scientific" aria-label="Funções científicas">
      <button class="mode" data-action="angle">DEG</button><button class="constant" data-action="pi">π</button><button class="constant" data-action="e">e</button><button class="constant" data-op="^">xʸ</button>
      <button data-unary="sin">sin</button><button data-unary="cos">cos</button><button data-unary="tan">tan</button><button data-unary="sqrt">√x</button>
      <button data-unary="square">x²</button><button data-unary="reciprocal">1/x</button><button data-unary="log">log</button><button data-unary="ln">ln</button>
      <button data-unary="factorial">n!</button><button data-action="backspace" aria-label="Apagar último dígito">⌫</button>
    </section>
    <section class="keys" aria-label="Teclas da calculadora">
      <button class="utility" data-action="clear" aria-label="Limpar tudo">AC</button>
      <button class="utility" data-action="sign" aria-label="Mudar sinal">±</button>
      <button class="utility" data-action="percent" aria-label="Percentagem">%</button>
      <button class="operator" data-op="÷" aria-label="Dividir">÷</button>
      <button data-digit="7">7</button><button data-digit="8">8</button><button data-digit="9">9</button><button class="operator" data-op="×" aria-label="Multiplicar">×</button>
      <button data-digit="4">4</button><button data-digit="5">5</button><button data-digit="6">6</button><button class="operator" data-op="−" aria-label="Subtrair">−</button>
      <button data-digit="1">1</button><button data-digit="2">2</button><button data-digit="3">3</button><button class="operator" data-op="+" aria-label="Somar">+</button>
      <button class="zero" data-digit="0">0</button><button data-action="decimal" aria-label="Ponto decimal">.</button><button class="equals" data-action="equals" aria-label="Igual">=</button>
    </section>
    <footer><span class="dot"></span> Também funciona com o teclado</footer>
  </main>
<script>
(() => {
  const display = document.getElementById('display');
  const expression = document.getElementById('expression');
  let current = '0', stored = null, operator = null, waiting = false, justSolved = false, degrees = true;
  const format = value => {
    if (!Number.isFinite(value)) return 'Erro';
    let s = String(value);
    if (s.length > 12) s = Number(value.toPrecision(10)).toString();
    return s;
  };
  function render(){ display.textContent = current; }
  function inputDigit(d){
    if (current === 'Erro' || waiting || justSolved) { current = d; waiting = false; justSolved = false; }
    else if (current === '0') current = d;
    else if (current.replace('-','').length < 12) current += d;
    render();
  }
  function calculate(a,b,op){
    if (op === '+') return a+b;
    if (op === '−') return a-b;
    if (op === '×') return a*b;
    if (op === '÷') return b === 0 ? NaN : a/b;
    if (op === '^') return Math.pow(a,b);
    return b;
  }
  function choose(op){
    if (current === 'Erro') return;
    const value = Number(current);
    if (operator && !waiting) { const result = calculate(stored,value,operator); current = format(result); stored = result; render(); }
    else stored = value;
    operator = op; waiting = true; justSolved = false;
    expression.textContent = `${format(stored)} ${op}`;
  }
  function equals(){
    if (!operator || waiting || current === 'Erro') return;
    const a = stored, b = Number(current), op = operator;
    const result = calculate(a,b,op);
    expression.textContent = `${format(a)} ${op} ${format(b)} =`;
    current = format(result); stored = null; operator = null; waiting = true; justSolved = true; render();
  }
  function clear(){ current='0';stored=null;operator=null;waiting=false;justSolved=false;expression.textContent='';render(); }
  function setConstant(value,label){
    current=format(value); waiting=false; justSolved=false; render(); expression.textContent=label;
  }
  function unary(name){
    if(current==='Erro') return;
    const x=Number(current), radians=degrees?x*Math.PI/180:x;
    let result, label=name;
    if(name==='sqrt') result=x<0?NaN:Math.sqrt(x);
    else if(name==='square') result=x*x;
    else if(name==='reciprocal') result=x===0?NaN:1/x;
    else if(name==='log') result=x<=0?NaN:Math.log10(x);
    else if(name==='ln') result=x<=0?NaN:Math.log(x);
    else if(name==='sin') result=Math.sin(radians);
    else if(name==='cos') result=Math.cos(radians);
    else if(name==='tan') result=Math.abs(Math.cos(radians))<1e-12?NaN:Math.tan(radians);
    else if(name==='factorial'){
      if(x<0||!Number.isInteger(x)||x>170) result=NaN;
      else { result=1; for(let i=2;i<=x;i++) result*=i; }
    }
    expression.textContent=`${label}(${current})`;
    current=format(result); waiting=false; justSolved=true; render();
  }
  function action(name){
    if(name==='clear') clear();
    if(name==='decimal') { if(current==='Erro'||waiting||justSolved){current='0.';waiting=false;justSolved=false;} else if(!current.includes('.')) current+='.'; render(); }
    if(name==='sign'&&current!=='0'&&current!=='Erro'){current=String(-Number(current));render();}
    if(name==='percent'&&current!=='Erro'){current=format(Number(current)/100);render();}
    if(name==='equals') equals();
    if(name==='angle'){degrees=!degrees;document.querySelector('[data-action="angle"]').textContent=degrees?'DEG':'RAD';}
    if(name==='pi') setConstant(Math.PI,'π');
    if(name==='e') setConstant(Math.E,'e');
    if(name==='backspace'&&current!=='Erro'){current=current.length>1?current.slice(0,-1):'0';if(current==='-')current='0';render();}
  }
  document.querySelector('.keys').addEventListener('click', e=>{
    const b=e.target.closest('button'); if(!b)return;
    if(b.dataset.digit!==undefined) inputDigit(b.dataset.digit);
    else if(b.dataset.op) choose(b.dataset.op);
    else if(b.dataset.action) action(b.dataset.action);
  });
  document.querySelector('.scientific').addEventListener('click', e=>{
    const b=e.target.closest('button'); if(!b)return;
    if(b.dataset.unary) unary(b.dataset.unary);
    else if(b.dataset.op) choose(b.dataset.op);
    else if(b.dataset.action) action(b.dataset.action);
  });
  document.getElementById('modeToggle').addEventListener('click',e=>{
    const panel=document.getElementById('scientific'),open=panel.classList.toggle('open');
    e.currentTarget.textContent=open?'− CIENTÍFICA':'+ CIENTÍFICA';
    e.currentTarget.setAttribute('aria-expanded',String(open));
  });
  document.addEventListener('keydown', e=>{
    if(e.key>='0'&&e.key<='9'){inputDigit(e.key);return;}
    if(e.key==='.') action('decimal');
    else if(e.key==='Enter'||e.key==='='){e.preventDefault();equals();}
    else if(e.key==='Escape'){clear();}
    else if(e.key==='Backspace'){if(!waiting&&current!=='Erro'){current=current.length>1?current.slice(0,-1):'0';if(current==='-')current='0';render();}}
    else if(e.key==='+')choose('+'); else if(e.key==='-')choose('−'); else if(e.key==='*')choose('×'); else if(e.key==='/'){e.preventDefault();choose('÷');}
    else if(e.key==='%')action('percent');
  });
})();
</script>
</body>
</html>
